<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DCS PRO v6</title>
    <style>
        body { background: #000; color: #00ff88; font-family: monospace; padding: 20px; margin: 0; }
        #console { width: 100%; height: 250px; background: #050505; border: 1px solid #222; overflow-y: auto; font-size: 11px; padding: 10px; box-sizing: border-box; margin-bottom: 20px; color: #00d2ff; }
        .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .box { background: #0a0a0a; border: 1px solid #1a1a1a; padding: 15px; border-radius: 8px; text-align: center; }
        .val { font-size: 24px; display: block; color: #fff; }
        .label { font-size: 10px; color: #666; }
        button { width: 100%; padding: 20px; background: #00d2ff; border: none; font-weight: bold; font-size: 16px; border-radius: 12px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="console">LOG: Sistem spreman. Klikni POVEŽI.</div>

    <div class="data-grid">
        <div class="box"><span class="label">OBRTAJI</span><span id="rpm" class="val">0</span></div>
        <div class="box"><span class="label">BRZINA</span><span id="speed" class="val">0</span></div>
    </div>

    <p style="text-align:center; font-size:10px; color:#444;">DCS PRO v6.0 | Build 2026</p>
    <button onclick="start()">POVEŽI vLINKER</button>

    <script>
        let char;
        const log = (m) => { document.getElementById('console').innerHTML += `<div>> ${m}</div>`; console.log(m); };

        async function start() {
            try {
                log("Skeniranje... Odaberi vLinker BLE.");
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [
                        '0000ffe0-0000-1000-8000-00805f9b34fb',
                        '0000fff0-0000-1000-8000-00805f9b34fb'
                    ]
                });

                log(`Povezivanje na ${device.name}...`);
                const server = await device.gatt.connect();
                
                log("Tražim Primary Service...");
                const services = await server.getPrimaryServices();
                if(services.length === 0) throw "Nema servisa!";
                
                log(`Pronađeno ${services.length} servisa. Uzimam prvi...`);
                const service = services[0];

                log("Tražim Karakteristiku...");
                const chars = await service.getCharacteristics();
                char = chars.find(c => c.properties.write || c.properties.writeWithoutResponse);
                
                if(!char) throw "Nema write karakteristike!";

                await char.startNotifications();
                char.addEventListener('characteristicvaluechanged', (e) => {
                    let d = new TextDecoder().decode(e.target.value).trim();
                    log(`RX: ${d}`);
                    parse(d);
                });

                log("Inicijalizacija: ATZ...");
                await send("ATZ");
                await new Promise(r => setTimeout(r, 1000));
                
                log("Sistem spreman! Počinje čitanje.");
                loop();

            } catch (e) {
                log(`GREŠKA: ${e.message || e}`);
            }
        }

        async function send(c) {
            if(!char) return;
            await char.writeValue(new TextEncoder().encode(c + "\r"));
        }

        function parse(d) {
            let clean = d.replace(/\s/g, '').replace(/>/g, '');
            if(clean.includes("410C")) {
                let hex = clean.substring(clean.indexOf("410C")+4, clean.indexOf("410C")+8);
                document.getElementById('rpm').innerText = Math.round(parseInt(hex, 16) / 4);
            }
            if(clean.includes("410D")) {
                let hex = clean.substring(clean.indexOf("410D")+4, clean.indexOf("410D")+6);
                document.getElementById('speed').innerText = parseInt(hex, 16);
            }
        }

        async function loop() {
            while(true) {
                await send("010C");
                await new Promise(r => setTimeout(r, 500));
                await send("010D");
                await new Promise(r => setTimeout(r, 500));
            }
        }
    </script>
</body>
</html>
