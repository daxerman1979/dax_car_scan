<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DCS PRO - v4</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000; --safe: #00ff88; --danger: #ff1111; --accent: #00d2ff; --card: #0f0f0f; }
        body, html { margin: 0; padding: 0; background: var(--bg); color: #fff; font-family: 'Roboto', sans-serif; height: 100%; overflow: hidden; }
        #start-screen { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9000; }
        .logo { font-family: 'Orbitron'; font-size: 45px; font-weight: 900; color: var(--accent); }
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 60px 10px; }
        .card { background: var(--card); border: 1px solid #1a1a1a; border-radius: 12px; padding: 12px; height: 85px; }
        .card-label { font-size: 9px; color: #666; text-transform: uppercase; }
        .card-val { font-family: 'Orbitron'; font-size: 22px; color: var(--safe); margin-top: 5px; }
        .status-bar { position: fixed; top: 0; width: 100%; height: 45px; background: #080808; border-bottom: 1px solid #1a1a1a; display: flex; align-items: center; padding: 0 15px; font-family: 'Orbitron'; font-size: 9px; z-index: 1000; }
        .btn { padding: 18px; border-radius: 12px; font-family: 'Orbitron'; font-weight: 900; border: none; background: var(--accent); color: #000; width: 80%; cursor: pointer; }
        #log-window { position: fixed; bottom: 0; width: 100%; height: 100px; background: #050505; color: #00ff00; font-family: monospace; font-size: 9px; overflow-y: scroll; padding: 10px; border-top: 1px solid #222; }
    </style>
</head>
<body>

    <div id="start-screen">
        <div class="logo">DCS PRO</div>
        <div style="color:#555; font-size:10px; margin-bottom:30px;">v4 - BLE STABILITY FIX</div>
        <button class="btn" onclick="connect()">POVEŽI UREĐAJ</button>
    </div>

    <div class="status-bar">STATUS: <span id="conn-status" style="margin-left:5px;">ODSPOJEN</span></div>

    <div class="dashboard">
        <div class="card"><div class="card-label">RPM</div><div class="card-val" id="rpm-val">0</div></div>
        <div class="card"><div class="card-label">BRZINA</div><div class="card-val" id="speed-val">0</div></div>
        <div class="card"><div class="card-label">TEMP VODE</div><div class="card-val" id="temp-val">--</div></div>
        <div class="card"><div class="card-label">NAPON</div><div class="card-val" id="volt-val" style="color:var(--accent)">--</div></div>
    </div>

    <div id="log-window">Sistem spreman. Čekam komandu...</div>

    <script>
        let device, server, char;
        let decoder = new TextDecoder();
        let encoder = new TextEncoder();

        function addLog(msg) {
            const log = document.getElementById('log-window');
            log.innerHTML += "> " + msg + "<br>";
            log.scrollTop = log.scrollHeight;
        }

        async function connect() {
            try {
                addLog("Tražim vLinker...");
                device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [
                        '0000ffe0-0000-1000-8000-00805f9b34fb', // Standardni vLinker BLE
                        '000018f0-0000-1000-8000-00805f9b34fb', // Alternativni OBD
                        '0000fff0-0000-1000-8000-00805f9b34fb'  // Kineski ELM327 BLE
                    ]
                });

                addLog("Povezivanje na GATT server...");
                server = await device.gatt.connect();
                
                addLog("Tražim Primary Service...");
                // Pokušavamo da nađemo bilo koji od poznatih servisa
                let service;
                try { service = await server.getPrimaryService('0000ffe0-0000-1000-8000-00805f9b34fb'); }
                catch(e) { service = await server.getPrimaryService('0000fff0-0000-1000-8000-00805f9b34fb'); }

                addLog("Tražim Karakteristiku...");
                char = await service.getCharacteristic(service.uuid.replace('0', '1')); // ffe1 ili fff1

                await char.startNotifications();
                char.addEventListener('characteristicvaluechanged', handleData);

                addLog("Inicijalizacija adaptera...");
                await sendCmd("ATZ"); await sleep(1000); // Reset traje duže
                await sendCmd("ATE0"); await sleep(300); // Isključi echo
                await sendCmd("ATSP0"); await sleep(500); // Auto protocol

                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('conn-status').innerText = "POVEZAN";
                document.getElementById('conn-status').style.color = "var(--safe)";
                
                startPolling();
            } catch (e) {
                addLog("GRESKA: " + e.message);
                alert("Greška pri povezivanju. Pogledaj log na dnu.");
            }
        }

        async function sendCmd(cmd) {
            if (char && device.gatt.connected) {
                await char.writeValue(encoder.encode(cmd + "\r"));
            }
        }

        function handleData(event) {
            let data = decoder.decode(event.target.value).replace(/\s/g, '').replace(/>/g, '');
            addLog("RX: " + data);

            if (data.includes("410C")) {
                let hex = data.substring(data.indexOf("410C")+4, data.indexOf("410C")+8);
                document.getElementById('rpm-val').innerText = Math.round(parseInt(hex, 16) / 4);
            }
            if (data.includes("410D")) {
                let hex = data.substring(data.indexOf("410D")+4, data.indexOf("410D")+6);
                document.getElementById('speed-val').innerText = parseInt(hex, 16);
            }
            if (data.includes("4105")) {
                let hex = data.substring(data.indexOf("4105")+4, data.indexOf("4105")+6);
                document.getElementById('temp-val').innerText = parseInt(hex, 16) - 40;
            }
            if (data.match(/\d+\.\d+V/)) {
                document.getElementById('volt-val').innerText = data;
            }
        }

        async function startPolling() {
            while (device.gatt.connected) {
                await sendCmd("010C"); await sleep(400);
                await sendCmd("010D"); await sleep(400);
                await sendCmd("0105"); await sleep(400);
                await sendCmd("ATRV"); await sleep(600);
            }
        }

        function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }
    </script>
</body>
</html>
