<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DCS PRO v60 - LIVE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000; --safe: #00ff88; --danger: #ff1111; --accent: #00d2ff; }
        body, html { margin: 0; padding: 0; background: #000; color: #fff; font-family: 'Roboto', sans-serif; height: 100%; overflow: hidden; }
        
        #start-screen { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9000; }
        .logo { font-family: 'Orbitron'; font-size: 50px; font-weight: 900; letter-spacing: 10px; margin-bottom: 30px; color: var(--accent); }
        
        .card { background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 20px; padding: 20px; margin-bottom: 15px; width: 90%; }
        .card-label { font-size: 12px; opacity: 0.6; text-transform: uppercase; }
        .card-val { font-family: 'Orbitron'; font-size: 40px; color: var(--safe); }
        
        .btn { padding: 20px 40px; border-radius: 12px; font-family: 'Orbitron'; font-weight: 900; border: none; cursor: pointer; background: var(--accent); color: #000; width: 80%; }
        #console { position: fixed; bottom: 10px; left: 10px; font-size: 10px; color: #444; font-family: monospace; }
        #loader { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 10000; align-items: center; justify-content: center; flex-direction: column; }
    </style>
</head>
<body>

    <div id="loader"><div style="color:var(--accent); font-family:Orbitron;">KOMUNIKACIJA...</div></div>

    <div id="start-screen">
        <div class="logo">DCS PRO</div>
        <button class="btn" onclick="connect()">POVEŽI VLINKER BLE</button>
        <p style="margin-top:20px; font-size:12px; color:#555;">OSIGURAJTE DA JE BLUETOOTH UKLJUČEN</p>
    </div>

    <div style="padding: 60px 20px;">
        <div class="card">
            <div class="card-label">Obrtaji Motora (RPM)</div>
            <div><span id="rpm-val" class="card-val">0</span> <span style="font-size:14px; color:#666;">RPM</span></div>
        </div>
        <div class="card">
            <div class="card-label">Brzina Vozila</div>
            <div><span id="speed-val" class="card-val">0</span> <span style="font-size:14px; color:#666;">KM/H</span></div>
        </div>
    </div>

    <div id="console">Log: spreman...</div>

    <script>
        let device, server, characteristic;
        let decoder = new TextDecoder();
        let encoder = new TextEncoder();

        async function log(msg) {
            document.getElementById('console').innerText = "Log: " + msg;
            console.log(msg);
        }

        async function connect() {
            try {
                log("Tražim uređaje...");
                device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['0000ffe0-0000-1000-8000-00805f9b34fb']
                });

                document.getElementById('loader').style.display = 'flex';
                
                log("Povezujem se na GATT...");
                server = await device.gatt.connect();
                
                log("Uzimam servis...");
                const service = await server.getPrimaryService('0000ffe0-0000-1000-8000-00805f9b34fb');
                
                log("Uzimam karakteristiku...");
                characteristic = await service.getCharacteristic('0000ffe1-0000-1000-8000-00805f9b34fb');

                // Slušaj odgovore od vLinkera
                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', handleData);

                // Inicijalizacija OBD2 protokola
                await sendCmd("ATZ");  // Reset
                await sleep(500);
                await sendCmd("ATL0"); // Isključi Linefeed
                await sleep(200);
                await sendCmd("0100"); // Proveri podržane PID-ove (budi ECU)

                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('loader').style.display = 'none';
                
                // Pokreni petlju čitanja
                startPolling();

            } catch (e) {
                log("GRESKA: " + e.message);
                document.getElementById('loader').style.display = 'none';
            }
        }

        async function sendCmd(cmd) {
            if (!characteristic) return;
            log("Šaljem: " + cmd);
            const data = encoder.encode(cmd + "\r");
            await characteristic.writeValue(data);
        }

        function handleData(event) {
            const val = decoder.decode(event.target.value).replace(/\s+/g, '');
            log("Odgovor: " + val);

            // Parsiranje RPM (010C odgovara sa 410CXXXX)
            if (val.includes("410C")) {
                let hex = val.substring(val.indexOf("410C") + 4, val.indexOf("410C") + 8);
                let rpm = Math.round(parseInt(hex, 16) / 4);
                document.getElementById('rpm-val').innerText = rpm;
            }

            // Parsiranje Brzine (010D odgovara sa 410DXX)
            if (val.includes("410D")) {
                let hex = val.substring(val.indexOf("410D") + 4, val.indexOf("410D") + 6);
                let speed = parseInt(hex, 16);
                document.getElementById('speed-val').innerText = speed;
            }
        }

        async function startPolling() {
            while (true) {
                try {
                    await sendCmd("010C"); // Traži RPM
                    await sleep(300);
                    await sendCmd("010D"); // Traži Brzinu
                    await sleep(300);
                } catch (e) {
                    log("Veza prekinuta.");
                    break;
                }
            }
        }

        function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }
    </script>
</body>
</html>
