<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DCS PRO - v5</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000; --safe: #00ff88; --danger: #ff1111; --accent: #00d2ff; --card: #0f0f0f; }
        body, html { margin: 0; padding: 0; background: var(--bg); color: #fff; font-family: 'Roboto', sans-serif; height: 100%; overflow: hidden; }
        #start-screen { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9000; }
        .logo { font-family: 'Orbitron'; font-size: 40px; font-weight: 900; color: var(--accent); }
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 60px 12px; }
        .card { background: var(--card); border: 1px solid #1a1a1a; border-radius: 12px; padding: 12px; height: 80px; }
        .card-label { font-size: 9px; color: #666; text-transform: uppercase; }
        .card-val { font-family: 'Orbitron'; font-size: 22px; color: var(--safe); margin-top: 5px; }
        .status-bar { position: fixed; top: 0; width: 100%; height: 45px; background: #080808; border-bottom: 1px solid #222; display: flex; align-items: center; padding: 0 15px; font-family: 'Orbitron'; font-size: 9px; z-index: 1000; }
        .btn { padding: 20px; border-radius: 12px; font-family: 'Orbitron'; font-weight: 900; border: none; background: var(--accent); color: #000; width: 85%; cursor: pointer; }
        #log-window { position: fixed; bottom: 0; width: 100%; height: 150px; background: #050505; color: #00ff88; font-family: monospace; font-size: 9px; overflow-y: auto; padding: 10px; border-top: 1px solid #333; box-sizing: border-box; }
    </style>
</head>
<body>

    <div id="start-screen">
        <div class="logo">DCS PRO</div>
        <div style="color:#666; font-size:9px; margin-bottom:30px;">VERSION 5.0 | HARD CONNECTION</div>
        <button class="btn" onclick="connect()">POVEŽI vLINKER</button>
    </div>

    <div class="status-bar">SISTEM: <b id="conn-status" style="color:var(--danger)">OFFLINE</b></div>

    <div class="dashboard">
        <div class="card"><div class="card-label">Obrtaji</div><div class="card-val" id="rpm-val">0</div></div>
        <div class="card"><div class="card-label">Brzina</div><div class="card-val" id="speed-val">0</div></div>
        <div class="card"><div class="card-label">Temperatura</div><div class="card-val" id="temp-val">--</div></div>
        <div class="card"><div class="card-label">Napon</div><div class="card-val" id="volt-val" style="color:var(--accent)">--</div></div>
    </div>

    <div id="log-window">STATUS: Čekam komandu...</div>

    <script>
        let device, server, char;
        const decoder = new TextDecoder();
        const encoder = new TextEncoder();

        function addLog(msg) {
            const log = document.getElementById('log-window');
            log.innerHTML += `<div>> ${msg}</div>`;
            log.scrollTop = log.scrollHeight;
        }

        async function connect() {
            try {
                addLog("Tražim uređaj...");
                device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [
                        '0000ffe0-0000-1000-8000-00805f9b34fb', 
                        '0000fff0-0000-1000-8000-00805f9b34fb',
                        '00001101-0000-1000-8000-00805f9b34fb'
                    ]
                });

                addLog(`Uređaj: ${device.name}`);
                
                // PAUZA pre povezivanja
                await sleep(500);
                addLog("Povezivanje na GATT server...");
                server = await device.gatt.connect();
                
                addLog("Uspješno! Pretraga servisa...");
                await sleep(500);
                
                let service = null;
                const services = ['0000ffe0-0000-1000-8000-00805f9b34fb', '0000fff0-0000-1000-8000-00805f9b34fb', '00001101-0000-1000-8000-00805f9b34fb'];
                
                for (let s of services) {
                    try {
                        service = await server.getPrimaryService(s);
                        addLog(`Pronađen servis: ${s}`);
                        break;
                    } catch (e) { continue; }
                }

                if (!service) throw new Error("Servis nije pronađen!");

                addLog("Tražim karakteristiku za pisanje...");
                const characteristics = await service.getCharacteristics();
                char = characteristics.find(c => c.properties.write || c.properties.writeWithoutResponse);
                
                if (!char) throw new Error("Nema karakteristike!");

                await char.startNotifications();
                char.addEventListener('characteristicvaluechanged', handleData);

                addLog("Šaljem ATZ...");
                await sendCmd("ATZ");
                await sleep(1000);
                
                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('conn-status').innerText = "ONLINE";
                document.getElementById('conn-status').style.color = "var(--safe)";
                
                startPolling();
            } catch (e) {
                addLog(`KRITIČNA GREŠKA: ${e.message}`);
                console.error(e);
            }
        }

        async function sendCmd(cmd) {
            if (char && device.gatt.connected) {
                try {
                    await char.writeValue(encoder.encode(cmd + "\r"));
                    addLog(`TX: ${cmd}`);
                } catch(e) { addLog(`TX GREŠKA: ${e.message}`); }
            }
        }

        function handleData(event) {
            let raw = decoder.decode(event.target.value).replace(/\s/g, '').replace(/>/g, '');
            addLog(`RX: ${raw}`);
            
            if (raw.includes("410C")) {
                let hex = raw.substring(raw.indexOf("410C")+4, raw.indexOf("410C")+8);
                document.getElementById('rpm-val').innerText = Math.round(parseInt(hex, 16) / 4);
            }
            if (raw.includes("410D")) {
                let hex = raw.substring(raw.indexOf("410D")+4, raw.indexOf("410D")+6);
                document.getElementById('speed-val').innerText = parseInt(hex, 16);
            }
        }

        async function startPolling() {
            while (device.gatt.connected) {
                await sendCmd("010C"); await sleep(500);
                await sendCmd("010D"); await sleep(500);
                await sendCmd("ATRV"); await sleep(1000);
            }
        }

        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
    </script>
</body>
</html>
